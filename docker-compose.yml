services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8000
      - CLIENT_URL=${CLIENT_URL}
    networks:
      - dokploy-network
      - internal

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - dokploy-network
      - internal
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - dokploy-network
      - internal
    depends_on:
      - api

networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge
