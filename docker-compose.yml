# =============================================================================
# Dockploy / Docker Compose deployment for Lekhaprati (real-state)
#
# Each app gets its own domain via Traefik Docker labels. Dockploy's Traefik
# reads these labels from containers attached to the `dokploy-network`.
#
# NOTE: PostgreSQL is NOT part of this compose. Use an existing database
# (e.g. a Dockploy-managed Database app, or any hosted Postgres) and set the
# DATABASE_URL env var in Dockploy's Environment tab.
#
# Before deploying:
#   1. Point your DNS records (A/CNAME) at this server for each domain:
#        realstate-api.vanijay.com  → API   (port 80/443 via Traefik)
#        realstate.vanijay.com      → Client (port 80/443 via Traefik)
#        admin.vanijay.com          → Admin  (port 80/443 via Traefik)
#   2. In Dockploy's Environment tab set at minimum:
#        DATABASE_URL=postgresql://<user>:<password>@<db-host>:5432/<db>
#        CLIENT_URL, ADMIN_URL, BETTER_AUTH_URL, BETTER_AUTH_SECRET, ...
#   3. Make sure the dokploy-network exists (Dockploy creates it automatically).
# =============================================================================
services:
  # ─── NestJS / GraphQL API ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      # Build the `runner` stage explicitly so this NEVER depends on stage
      # order. (The Dockerfile also keeps `runner` last, but being explicit
      # here protects against future reordering.)
      target: runner
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=${CLIENT_URL}
      - ADMIN_URL=${ADMIN_URL}
      # Point at your existing database. Inside Dockploy's network prefer the
      # internal Docker DNS name of the DB app, e.g.:
      #   postgresql://<user>:<password>@<db-app-name>:5432/postgres
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - WHATSAPP_API_URL=${WHATSAPP_API_URL}
    labels:
      # HTTP → HTTPS redirect + HTTPS routing for the API domain
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.middlewares.realstate-redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.api.middlewares=realstate-redirect-to-https"
      - "traefik.http.routers.api-secure.entrypoints=websecure"
      - "traefik.http.routers.api-secure.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.api-secure.tls=true"
      - "traefik.http.routers.api-secure.tls.certresolver=le"
      - "traefik.http.services.api.loadbalancer.server.port=5000"
    networks:
      - dokploy-network
      - internal

  # ─── Next.js Public Marketplace (client) ────────────────────────────────
  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        # Internal Docker address for /api/auth/* rewrites in next.config.js
        # (baked at build time by the client Dockerfile)
        - AUTH_API_URL=${AUTH_API_URL:-http://api:5000}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - AUTH_API_URL=${AUTH_API_URL:-http://api:5000}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.client.entrypoints=web"
      - "traefik.http.routers.client.rule=Host(`${CLIENT_DOMAIN}`)"
      - "traefik.http.routers.client.middlewares=realstate-redirect-to-https"
      - "traefik.http.routers.client-secure.entrypoints=websecure"
      - "traefik.http.routers.client-secure.rule=Host(`${CLIENT_DOMAIN}`)"
      - "traefik.http.routers.client-secure.tls=true"
      - "traefik.http.routers.client-secure.tls.certresolver=le"
      - "traefik.http.services.client.loadbalancer.server.port=3000"
    networks:
      - dokploy-network
      - internal
    depends_on:
      - api

  # ─── Next.js Admin Console ──────────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        # Internal Docker address for /api/auth/* rewrites in next.config.js
        # (baked at build time by the admin Dockerfile)
        - AUTH_API_URL=${AUTH_API_URL:-http://api:5000}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - AUTH_API_URL=${AUTH_API_URL:-http://api:5000}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.admin.entrypoints=web"
      - "traefik.http.routers.admin.rule=Host(`${ADMIN_DOMAIN}`)"
      - "traefik.http.routers.admin.middlewares=realstate-redirect-to-https"
      - "traefik.http.routers.admin-secure.entrypoints=websecure"
      - "traefik.http.routers.admin-secure.rule=Host(`${ADMIN_DOMAIN}`)"
      - "traefik.http.routers.admin-secure.tls=true"
      - "traefik.http.routers.admin-secure.tls.certresolver=le"
      - "traefik.http.services.admin.loadbalancer.server.port=3000"
    networks:
      - dokploy-network
      - internal
    depends_on:
      - api

networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge
